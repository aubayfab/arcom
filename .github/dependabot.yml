# Mises à jour groupées, une fois par mois et par écosystème.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # Les types suivent la version majeure de Node utilisée (22, voir les workflows).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    groups:
      android:
        patterns: ["*"]
